<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    cursor:none;
  }
  .stage {
    position:relative;
    width:100vw; height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .stage img {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter: contrast(1.1) brightness(0.95);
  }
  .haha {
    position:absolute;
    font-family: 'Creepster', 'Chiller', 'Impact', cursive, sans-serif;
    color:#b30000;
    text-shadow:
      0 0 8px #ff0000,
      0 0 18px #ff0000,
      0 0 30px #660000,
      2px 2px 0 #000;
    font-weight:bold;
    letter-spacing:2px;
    white-space:nowrap;
    user-select:none;
    pointer-events:none;
    animation-name: drift, flicker;
    animation-timing-function: linear, steps(2);
    animation-iteration-count: infinite, infinite;
    opacity:0.9;
  }
  @keyframes flicker {
    0%   { opacity:0.55; }
    25%  { opacity:1; }
    50%  { opacity:0.4; }
    75%  { opacity:0.95; }
    100% { opacity:0.6; }
  }
  @keyframes drift {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    20%  { transform: translate(30px,-20px) rotate(-6deg) scale(1.05); }
    40%  { transform: translate(-25px,15px) rotate(4deg) scale(0.95); }
    60%  { transform: translate(20px,25px) rotate(-3deg) scale(1.08); }
    80%  { transform: translate(-30px,-15px) rotate(5deg) scale(0.97); }
    100% { transform: translate(0,0) rotate(0deg) scale(1); }
  }

  #startScreen {
    position:fixed; inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
  }
  #startBtn {
    background:transparent;
    color:#444;
    border:1px solid #333;
    padding:14px 30px;
    font-family:sans-serif;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:4px;
  }
  #startBtn:hover { color:#888; border-color:#666; }

  .hidden { display:none !important; }

  .flash {
    position:fixed; inset:0;
    background:#fff;
    z-index:500;
    opacity:0;
    pointer-events:none;
  }

  audio { display:none; }
</style>
</head>

const words = ["HAHAHA","HAHAHA","HAHAHA","HAHAHA","HAHAHA","HAHAHA"];

function rand(min, max){ return Math.random() * (max - min) + min; }

function spawnHaha(){
  const el = document.createElement('div');
  el.className = 'haha';
  el.textContent = words[Math.floor(Math.random()*words.length)];

  const size = rand(28, 72);
  el.style.fontSize = size + 'px';

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  el.style.left = rand(0, vw - size*3) + 'px';
  el.style.top = rand(0, vh - size) + 'px';

  const driftDur = rand(2.5, 5);
  const flickerDur = rand(0.15, 0.4);
  el.style.animationDuration = driftDur + 's, ' + flickerDur + 's';

  stage.appendChild(el);

  setTimeout(() => { el.remove(); }, driftDur * 3000);
}

function startJumpscare(){
  startScreen.classList.add('hidden');
  stage.classList.remove('hidden');

  // flash effect
  flashEl.style.transition = 'opacity 0.05s';
  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 80);

  // try to play a scream-ish beep via WebAudio (no external file needed)
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.9);
  } catch(e){}

  // spawn multiple HAHAHA repeatedly
  for(let i=0;i<8;i++){ spawnHaha(); }
  setInterval(() => {
    spawnHaha();
  }, 350);
}

document.getElementById('startBtn').addEventListener('click', startJumpscare);
</script>
